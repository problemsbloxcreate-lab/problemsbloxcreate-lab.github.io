<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- tema = o MESMO do Estúdio; o padrão é o ESCURO (pedido da dona, 26/11/2026): só fica claro quem escolheu o claro -->
<script>try{document.documentElement.dataset.tema=localStorage.getItem('ep-tema')==='claro'?'claro':'escuro'}catch{document.documentElement.dataset.tema='escuro'}</script>
<title>Área da equipe · Cérebro do Estúdio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icone-180.png">
<script>
// a Área da equipe mora no endereço único do Estúdio Problems; quem abrir a cópia do GitHub Pages vai para lá
if (location.hostname === 'problemsbloxcreate-lab.github.io') location.replace('https://estudio.problemsraiz.workers.dev/cerebro/ferramentas.html' + location.search);
</script>
<!-- login do Google do menu: sem sessão, manda para o menu e volta para cá depois de entrar -->
<script src="/estudio-login.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<!-- o MESMO visual do Livro (cerebro/index.html): fontes, cores, cartões e tema -->
<link rel="stylesheet" href="/cerebro/cerebro.css">
</head>
<body class="equipe">
<div class="menu"><button id="abre" type="button">Abas</button><b>Área da equipe</b></div>
<div class="app">
  <aside class="lado" id="lado">
    <a class="voltar" href="/cerebro/"><span aria-hidden="true">←</span> Voltar ao Livro</a>
    <a class="marca" href="?aba=pedidos" data-nav="aba=pedidos"><b>Área da equipe</b><small>Cérebro do Estúdio Problems</small></a>
    <form class="busca" id="busca" role="search"><input id="q" type="search" placeholder="Buscar em todo o Cérebro" aria-label="Buscar em todo o Cérebro" autocomplete="off"></form>
    <nav class="abas" id="abas" aria-label="Abas da Área da equipe"></nav>
  </aside>
  <main>
    <div class="topo"><div id="barra" hidden></div><span class="esp"></span><button class="tema-bt" id="tema" type="button" title="Trocar entre claro e escuro" aria-label="Trocar entre claro e escuro"></button><div class="conta"><span data-estudio-conta></span></div></div>
    <div id="tela"></div>
  </main>
</div>
<div id="prog" hidden aria-hidden="true"></div>
<div id="avisos" aria-live="polite"></div>
<script src="cerebro.js"></script>
<script>window.ESTUDIO_CONTA = { token: () => window.EstudioLogin?.token?.() };</script>
<script src="/estudio-conta.js" defer></script>
</body>
</html>
