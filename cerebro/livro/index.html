<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- tema = o MESMO do Estúdio; o padrão é o ESCURO (pedido da dona, 26/11/2026): só fica claro quem escolheu o claro -->
<script>try{document.documentElement.dataset.tema=localStorage.getItem('ep-tema')==='claro'?'claro':'escuro'}catch{document.documentElement.dataset.tema='escuro'}</script>
<title>Cérebro do Estúdio</title>
<meta name="description" content="Livro do Estúdio Problems: regras, decisões e o estado de cada programa. Para IAs, o livro inteiro em texto: https://turma-ia.problemsraiz.workers.dev/cerebro/livro.md">
<link rel="alternate" type="text/markdown" href="https://turma-ia.problemsraiz.workers.dev/cerebro/livro.md">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<!-- visual das duas páginas do Cérebro (o Livro e a Área da equipe) num arquivo só -->
<link rel="stylesheet" href="/cerebro/cerebro.css">
</head>
<body>
<div class="menu"><button id="abre">Páginas</button><b>Cérebro do Estúdio</b></div>
<div class="app">
  <aside class="lado" id="lado">
    <a class="marca" href="#"><b>Cérebro</b><small>O Livro do Estúdio Problems</small></a>
    <div class="busca"><input id="q" placeholder="Buscar no livro  ( / )" autocomplete="off" aria-label="Buscar no livro"></div>
    <div class="modo"><button id="m-ler" class="on">Ler</button><button id="m-mapa">Mapa</button><button id="m-mem">Memórias</button></div>
    <nav id="nav" aria-label="Páginas do livro"></nav>
    <div class="rodape">
      <button id="copia">Copiar esta página (para IA)</button>
      <a href="https://turma-ia.problemsraiz.workers.dev/cerebro/livro.md" target="_blank" rel="noopener">Livro inteiro em texto (para IA)</a>
      <a id="ferr" class="equipe-link" href="/cerebro/ferramentas.html"><b>Área da equipe</b><small>Pedidos, revisão, lixeira e acesso das IAs</small></a>
    </div>
  </aside>
  <main>
    <div class="topo"><div class="caminho" id="caminho"></div><button class="tema-bt" id="tema" data-tema-bt title="Trocar entre claro e escuro" aria-label="Trocar entre claro e escuro"></button><div class="conta"><span data-estudio-conta></span></div></div>
    <div id="vista"></div>
  </main>
</div>
<div class="aviso" id="aviso"></div>
<script>
const API = 'https://turma-ia.problemsraiz.workers.dev/cerebro/livro';
let LIVRO = [], POR = {}, ATUAL = null, MEMS = [];
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const guarda = (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch { } }, le = (k, d) => { try { return JSON.parse(sessionStorage.getItem(k)) ?? d; } catch { return d; } };
// fora do site do Estúdio (cópia aberta no GitHub Pages) as ferramentas da equipe ficam no Estúdio
if (!/problemsraiz\.workers\.dev$/.test(location.hostname)) $('#ferr').href = 'https://estudio.problemsraiz.workers.dev/cerebro/ferramentas.html';

/* dados: páginas, seções (memórias curtas) e ligações (liga a / ligado por) */
function prepara(d) {
  LIVRO = []; POR = {};
  for (const g of d.grupos || []) for (const p of g.paginas) {
    const t = (p.md.match(/^# (.+)$/m) || [, p.nome])[1].trim();
    const x = { g: g.nome, c: slug(p.nome), nome: p.nome, t, md: p.md, em: p.em, resumo: p.resumo, secoes: [], vai: new Set(), vem: new Set() };
    let atual = { t, id: '', txt: '' };
    for (const l of p.md.split('\n')) { const m = l.match(/^## (.+)/); if (m) { x.secoes.push(atual); atual = { t: m[1].trim(), id: slug(m[1]), txt: '' }; } else atual.txt += l + '\n'; }
    x.secoes.push(atual); LIVRO.push(x); POR[x.c] = x;
  }
  for (const p of LIVRO) for (const m of p.md.matchAll(/\[\[([^\]]+)\]\]/g)) { const o = POR[slug(m[1])]; if (o && o !== p) { p.vai.add(o.c); o.vem.add(p.c); } }
  MEMS = (d.memorias || []).map((m, i) => ({ n: i + 1, texto: m.texto, c: m.pagina && POR[slug(m.pagina)] ? slug(m.pagina) : '' }));
}
const secoesReais = p => p.secoes.filter(s => s.id && s.id !== 'ligacoes');
const resumo = p => (p.resumo || '').replace(/^Para que serve:\s*/i, '');
const liga = md => md.replace(/\[\[([^\]]+)\]\]/g, (m, n) => POR[slug(n)] ? `<a class="liga" href="#${slug(n)}">${esc(n)}</a>` : esc(n));
const renderer = new marked.Renderer();
renderer.heading = (txt, lv, raw) => `<h${lv} id="${slug(raw)}"${lv === 2 && /^evitar$/i.test(raw.trim()) ? ' class="evitar"' : ''}>${txt}</h${lv}>`;
marked.setOptions({ renderer, mangle: false, headerIds: false });

/* caminho: por onde a pessoa passou (fica guardado nesta aba) */
let CAM = le('cb-caminho', []);
function anda(c, s) { const k = c + (s ? '/' + s : ''); CAM = CAM.filter(x => x !== k); CAM.push(k); CAM = CAM.slice(-9); guarda('cb-caminho', CAM); }
function pintaCaminho(atualK) {
  const itens = CAM.filter(k => POR[k.split('/')[0]]);
  $('#caminho').innerHTML = '<span class="rot">Caminho</span>' + (itens.length ? itens.map((k, i) => { const [c, s] = k.split('/'), p = POR[c], sec = s && p.secoes.find(x => x.id === s);
    return (i ? '<span class="seta">›</span>' : '') + `<a href="#${k}" class="${k === atualK ? 'on' : ''}">${esc(p.nome)}${sec ? ' · ' + esc(sec.t) : ''}</a>`; }).join('') : '<span class="seta">abra uma página</span>')
    ;

  const on = $('#caminho a.on'); if (on) on.scrollIntoView({ inline: 'nearest', block: 'nearest' });
}

/* lado: páginas e, na página aberta, as seções dela */
function pintaNav(cod, sec) {
  let h = '', g = '';
  for (const p of LIVRO) {
    if (p.g !== g) { g = p.g; h += `<div class="grupo">${esc(g)}</div>`; }
    h += `<a href="#${p.c}" class="${p.c === cod ? 'on' : ''}">${esc(p.nome)}</a>`;
    if (p.c === cod) h += '<div class="secs">' + secoesReais(p).map(s => `<a href="#${p.c}/${s.id}" class="${s.id === sec ? 'on' : ''}">${esc(s.t)}</a>`).join('') + '</div>';
  }
  $('#nav').innerHTML = h;
}
const modo = m => { $('#m-ler').classList.toggle('on', m === 'ler'); $('#m-mapa').classList.toggle('on', m === 'mapa'); $('#m-mem').classList.toggle('on', m === 'mem'); };

/* memórias rápidas: cada memória curta leva à página longa; a escolhida fica marcada */
function memorias(sel) {
  modo('mem'); ATUAL = null; pintaNav(null); document.title = 'Memórias · Cérebro do Estúdio'; sel = +sel || 0;
  $('#vista').innerHTML = `<div class="mems"><h1>Memórias rápidas</h1><p class="sub">O que vale sempre, em uma frase. Cada uma leva à página completa do livro.</p>`
    + MEMS.map(m => `<div class="mem ${m.n === sel ? 'sel' : ''}" data-n="${m.n}"><span class="num">${m.n}</span><p>${esc(m.texto)}</p>${m.c ? `<a class="chip liga" href="#${m.c}">${esc(POR[m.c].nome)} →</a>` : ''}</div>`).join('') + '</div>';
  document.querySelectorAll('.mem').forEach(el => el.onclick = e => { if (e.target.closest('a')) return; guarda('cb-mem', +el.dataset.n); location.hash = 'memorias/' + el.dataset.n; });
  pintaCaminho(); if (!sel) window.scrollTo(0, 0);
}

/* ler */
function abre(cod, sec) {
  const p = POR[cod] || LIVRO[0]; if (!p) return; ATUAL = p.c; modo('ler'); anda(p.c, sec);
  const chipsDe = set => [...set].map(c => `<a class="chip liga" href="#${c}">${esc(POR[c].nome)}</a>`).join('') || '<span style="color:var(--fraco)">nenhuma</span>';
  $('#vista').innerHTML = `<div class="ler"><article class="folha">
      <div class="migalha"><span>${esc(p.g)} · ${esc(p.nome)}</span><span>${Math.max(1, Math.round(p.md.split(/\s+/).length / 220))} min de leitura</span></div>
      ${marked.parse(liga(p.md.replace(/\n## Ligações[\s\S]*$/, '')))}
      <p class="data">Atualizada em ${new Date(p.em).toLocaleDateString('pt-BR')}</p></article>
    <aside class="guia">
      ${MEMS.some(m => m.c === p.c) ? `<div class="bloco"><b>Memórias rápidas daqui</b>${MEMS.filter(m => m.c === p.c).map(m => `<a class="mem-mini" href="#memorias/${m.n}">${esc(m.texto)}</a>`).join('')}</div>` : ''}
      <div class="bloco toc"><b>Nesta página</b>${secoesReais(p).map(s => `<a href="#${p.c}/${s.id}" data-id="${s.id}">${esc(s.t)}</a>`).join('')}</div>
      <div class="bloco"><b>Liga a</b><div class="chips">${chipsDe(p.vai)}</div></div>
      <div class="bloco"><b>Ligado por</b><div class="chips">${chipsDe(p.vem)}</div></div>
    </aside></div>`;
  document.title = p.nome + ' · Cérebro do Estúdio';
  marca(sec); pintaCaminho(p.c + (sec ? '/' + sec : ''));
  if (sec) document.getElementById(sec)?.scrollIntoView(); else window.scrollTo(0, 0);
  $('#lado').classList.remove('aberto');
}
// a seção escolhida FICA marcada (no lado, no índice e no título) até escolher outra
function marca(sec) {
  pintaNav(ATUAL, sec);
  document.querySelectorAll('.guia .toc a').forEach(a => a.classList.toggle('on', a.dataset.id === sec));
  document.querySelectorAll('.folha h2').forEach(h => h.classList.toggle('on', h.id === sec));
}

/* mapa: uma coluna por grupo; clicar seleciona a página e acende as ligadas a ela */
function mapa(sel) {
  modo('mapa'); ATUAL = null; pintaNav(null); document.title = 'Mapa · Cérebro do Estúdio';
  const grupos = [...new Set(LIVRO.map(p => p.g))], s = POR[sel];
  const cls = p => !s ? '' : p.c === s.c ? 'sel' : [s.vai.has(p.c) ? 'vai' : '', s.vem.has(p.c) ? 'vem' : ''].join(' ');
  const chips = (set, pre) => [...set].map(c => `<a class="chip liga" href="#${pre}${c}">${esc(POR[c].nome)}</a>`).join('') || '—';
  $('#vista').innerHTML = `<div class="mapa"><h1>Mapa do livro</h1><p class="sub">Clique numa página: ela fica selecionada e as ligadas a ela acendem.</p>
    <div class="colunas ${s ? 'tem-sel' : ''}">${grupos.map(g => `<div class="col"><h3>${esc(g)}</h3>${LIVRO.filter(p => p.g === g).map(p =>
      `<button class="cartao ${cls(p)}" data-c="${p.c}"><span class="n">${secoesReais(p).length} seções</span><b>${esc(p.nome)}</b><small>${esc(resumo(p))}</small><span class="tag vai">a selecionada liga a esta</span><span class="tag vem">esta liga à selecionada</span></button>`).join('')}</div>`).join('')}</div>
    ${s ? `<section class="detalhe"><h2>${esc(s.nome)}</h2><p>${esc(resumo(s))}</p>
      <div class="linha"><span>Seções</span><div class="chips">${secoesReais(s).map(x => `<a class="chip" href="#${s.c}/${x.id}">${esc(x.t)}</a>`).join('')}</div></div>
      <div class="linha"><span>Liga a</span><div class="chips">${chips(s.vai, 'mapa/')}</div></div>
      <div class="linha"><span>Ligado por</span><div class="chips">${chips(s.vem, 'mapa/')}</div></div>
      <a class="abrir" href="#${s.c}">Abrir a página</a></section>` : ''}</div>`;
  document.querySelectorAll('.cartao').forEach(b => b.onclick = () => { guarda('cb-mapa', b.dataset.c); location.hash = 'mapa/' + b.dataset.c; });
  pintaCaminho(); if (s) $('.detalhe')?.scrollIntoView({ block: 'nearest' }); else window.scrollTo(0, 0);
}

/* busca: acha a seção e leva direto a ela */
function busca(q) {
  const ps = norm(q).split(/\s+/).filter(w => w.length > 1); if (!ps.length) return rota();
  const achados = [];
  for (const p of LIVRO) for (const s of p.secoes) { if (s.id === 'ligacoes') continue; const n = norm(s.t + ' ' + s.txt); let pts = 0;
    for (const w of ps) { const k = n.split(w).length - 1; if (!k) { pts = 0; break; } pts += k + (norm(s.t).includes(w) ? 5 : 0); } if (pts) achados.push({ p, s, pts }); }
  achados.sort((a, b) => b.pts - a.pts);
  const trecho = t => { const n = norm(t), i = Math.max(0, n.indexOf(ps[0]) - 70); let x = esc(t.slice(i, i + 220).replace(/[#*`>|\[\]]/g, ''));
    for (const w of ps) x = x.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>'); return (i ? '… ' : '') + x + ' …'; };
  $('#vista').innerHTML = `<div class="res" style="max-width:760px;margin:0 auto"><h1>${achados.length} resultado${achados.length === 1 ? '' : 's'} para “${esc(q)}”</h1>`
    + achados.slice(0, 40).map(a => `<a class="item" href="#${a.p.c}${a.s.id ? '/' + a.s.id : ''}"><div class="onde">${esc(a.p.nome)}${a.s.id ? ' › ' + esc(a.s.t) : ''}</div><div class="trecho">${trecho(a.s.txt || a.s.t)}</div></a>`).join('') + '</div>';
}

/* rotas: #pagina · #pagina/secao · #mapa · #mapa/pagina */
function rota() {
  const [a, b] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (a === 'mapa') return mapa(b || le('cb-mapa', null));
  if (a === 'memorias') return memorias(b || le('cb-mem', 0));
  if (a && POR[a] && a === ATUAL && b) { anda(a, b); marca(b); pintaCaminho(a + '/' + b); document.getElementById(b)?.scrollIntoView({ behavior: 'smooth' }); return; }
  abre(POR[a] ? a : (LIVRO[0] && LIVRO[0].c), b);
}
addEventListener('hashchange', () => { $('#q').value = ''; rota(); });
$('#q').addEventListener('input', e => busca(e.target.value));
addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); } if (e.key === 'Escape') { $('#q').value = ''; rota(); } });
$('#m-ler').onclick = () => { const k = ATUAL || CAM[CAM.length - 1] || ''; if (location.hash.slice(1) === k) rota(); else location.hash = k; };
$('#m-mapa').onclick = () => { const s = le('cb-mapa', null); location.hash = 'mapa' + (s ? '/' + s : ''); };
$('#m-mem').onclick = () => { const s = le('cb-mem', 0); location.hash = 'memorias' + (s ? '/' + s : ''); };
$('#abre').onclick = () => $('#lado').classList.toggle('aberto');
const aviso = t => { $('#aviso').textContent = t; $('#aviso').classList.add('ver'); setTimeout(() => $('#aviso').classList.remove('ver'), 1400); };
$('#copia').onclick = async () => { const p = POR[ATUAL] || LIVRO[0]; try { await navigator.clipboard.writeText(p.md); aviso('Página copiada'); } catch { aviso('Não deu para copiar'); } };
// tema: o MESMO do Estúdio (html[data-tema], localStorage 'ep-tema'): trocar aqui vale em todos os programas
const SOL = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const LUA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const temaAgora = () => document.documentElement.dataset.tema === 'claro' ? 'claro' : 'escuro';
const pintaTema = () => { const e = temaAgora() === 'escuro'; $('#tema').innerHTML = e ? SOL : LUA; $('#tema').title = e ? 'Usar o tema claro' : 'Usar o tema escuro'; };
$('#tema').onclick = () => { const novo = temaAgora() === 'escuro' ? 'claro' : 'escuro'; document.documentElement.dataset.tema = novo; try { localStorage.setItem('ep-tema', novo); } catch { } pintaTema(); };
pintaTema();
// selo da versão no canto (o MESMO componente do menu e das telas de carregamento, do /estudio-carregando.js), com o "Histórico" ao lado
{ let n = 0; const poe = () => window.EstudioSuporte?.fixar ? window.EstudioSuporte.fixar({ historico: true }) : ++n < 40 && setTimeout(poe, 250); poe(); }
$('#vista').innerHTML = '<p style="color:var(--suave)">Abrindo o livro…</p>';
fetch(API).then(r => r.json()).then(d => { prepara(d); rota(); })
  .catch(() => { $('#vista').innerHTML = '<h1 style="font:650 28px Fraunces,serif">Não deu para abrir</h1><p>O servidor do Cérebro não respondeu. Tente de novo em instantes.</p>'; });
</script>
</body>
</html>
