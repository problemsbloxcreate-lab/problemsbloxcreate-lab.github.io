<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MÚSICAS · Estúdio Problems</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icone-180.png">
<script>
// as Músicas moram no endereço único do Estúdio Problems; quem abrir a cópia do GitHub Pages vai para lá
if (location.hostname === 'problemsbloxcreate-lab.github.io') location.replace('https://estudio.problemsraiz.workers.dev/musicas/' + location.search);
</script>
<!-- login do Google do menu: sem sessão, manda para o menu e volta para cá depois de entrar -->
<script src="/estudio-login.js"></script>
<link rel="stylesheet" href="musicas.css">
</head>
<body>
<header class="top">
  <a class="logo" href="./" data-vai="inicio" title="Voltar ao início"><span class="ic-prog" data-estudio-icone="mu" aria-hidden="true"></span><div><b>MÚSICAS</b><small>Estúdio Problems</small></div></a>
  <nav class="abas" id="abas" aria-label="Seções das Músicas"></nav>
  <form id="busca" role="search"><input id="q" type="search" placeholder="Buscar som ou música" aria-label="Buscar som ou música" autocomplete="off"></form>
  <span data-estudio-conta></span>
</header>
<main id="tela"></main>
<footer id="toca" hidden>
  <button id="t-play" class="t-bt" title="Tocar ou pausar" aria-label="Tocar ou pausar"></button>
  <div class="t-info"><b id="t-nome"></b><small id="t-pasta"></small></div>
  <input id="t-pos" type="range" min="0" max="1000" value="0" aria-label="Posição do som">
  <span id="t-tempo">0:00</span>
  <input id="t-vol" type="range" min="0" max="100" value="80" aria-label="Volume">
</footer>
<div id="lado" hidden></div>
<div id="avisos" aria-live="polite"></div>
<audio id="audio" preload="none"></audio>
<input id="arquivos" type="file" accept="audio/*,.mp3,.wav,.ogg,.opus,.flac,.m4a,.aac,.webm" multiple hidden>
<script src="musicas.js"></script>
<script>window.ESTUDIO_CONTA = { token: () => window.EstudioLogin?.token?.() };</script>
<script src="/estudio-conta.js" defer></script>
</body>
</html>
