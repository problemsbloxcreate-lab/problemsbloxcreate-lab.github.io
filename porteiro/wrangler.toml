# Porteiro do Estúdio Problems — um endereço só para o menu e todos os projetos.
# Publicado pela Action "Publicar o porteiro (Cloudflare)" (.github/workflows/porteiro.yml) na conta da Cloudflare
# dos segredos CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID deste repositório.
name = "estudio"
main = "worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[assets]
directory = "../dist"          # a Action copia para cá só index.html, 404.html e estudio-login.js
binding = "ASSETS"
run_worker_first = true        # o porteiro decide tudo antes de qualquer arquivo sair
not_found_handling = "none"

# ligação direta com o servidor da turma (mesma conta da Cloudflare)
[[services]]
binding = "TURMA"
service = "turma-ia"

# Shorts + Modelador (worker estudio-problems, nesta mesma conta)
[[services]]
binding = "SHORTS"
service = "estudio-problems"

[vars]
SERVIDOR = "https://turma-ia.problemsraiz.workers.dev"
# caminho no endereço único → de onde vem o projeto. Para pôr outro projeto atrás do login, acrescente aqui.
# "servico": nome da ligação direta, quando o projeto é um worker desta mesma conta (precisa do [[services]] abaixo).
# "assinar": true = o projeto tem portão próprio e aceita o passe assinado do porteiro (no lugar da senha).
PROJETOS = '''{
  "/animador/":  "https://problemsbloxcreate-lab.github.io/animador/",
  "/shorts/":    { "origem": "https://estudio-problems.problemsraiz.workers.dev/", "assinar": true, "servico": "SHORTS" },
  "/modelador/": { "origem": "https://estudio-problems.problemsraiz.workers.dev/modelador/", "assinar": true, "servico": "SHORTS" },
  "/editor/":    { "origem": "https://editor-problems.problemsraiz.workers.dev/", "assinar": true, "servico": "EDITOR" }
}'''
