# Porteiro do Estúdio Problems — um endereço só para o menu e todos os projetos.
# Publicado pela Action "Publicar o porteiro (Cloudflare)" (.github/workflows/porteiro.yml) na conta da Cloudflare
# dos segredos CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID deste repositório.
name = "estudio"
main = "worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[assets]
directory = "../dist"          # a Action copia para cá index.html, 404.html, estudio-login.js, estudio-conta.js, estudio-carregando.js e o ícone (favicon.svg, favicon.ico, icone-180.png)
binding = "ASSETS"
run_worker_first = true        # o porteiro decide tudo antes de qualquer arquivo sair
not_found_handling = "none"

# ligação direta com o servidor da turma (mesma conta da Cloudflare)
[[services]]
binding = "TURMA"
service = "turma-ia"

# Shorts + Modelador (worker estudio-problems, nesta mesma conta)
[[services]]
binding = "SHORTS"
service = "estudio-problems"

# Editor de vídeo longo (worker editor-problems, nesta mesma conta)
[[services]]
binding = "EDITOR"
service = "editor-problems"

[vars]
SERVIDOR = "https://turma-ia.problemsraiz.workers.dev"
# caminho no endereço único → de onde vem o projeto. Para pôr outro projeto atrás do login, acrescente aqui.
# "nuvem": true = o projeto usa o servidor de sons; ele vai por /nuvem/ (com o passe), sem senha da equipe.
# "para": só redireciona para outro caminho (ex.: { "para": "/shorts/" }).
# "servico": nome da ligação direta, quando o projeto é um worker desta mesma conta (precisa do [[services]] abaixo).
# "assinar": true = o projeto tem portão próprio e aceita o passe assinado do porteiro (no lugar da senha).
PROJETOS = '''{
  "/animador/":  "https://problemsbloxcreate-lab.github.io/animador/",
  "/shorts/":    { "origem": "https://estudio-problems.problemsraiz.workers.dev/", "assinar": true, "servico": "SHORTS", "nuvem": true, "conta": true },
  "/modelador/": { "origem": "https://problemsbloxcreate-lab.github.io/modelador/", "nuvem": true, "conta": true },
  "/editor/":    { "origem": "https://editor-problems.problemsraiz.workers.dev/", "assinar": true, "servico": "EDITOR", "nuvem": true, "conta": true },
  "/nuvem/":     { "origem": "https://sons-problems.problemsbloxcreate.workers.dev/", "assinar": true }
}'''

# contas das pessoas (nome, foto, fundo do menu). O id é preenchido pela Action (cria o KV na primeira vez).
[[kv_namespaces]]
binding = "PERFIS"
id = "PREENCHIDO_PELA_ACTION"

# quem está online e em qual programa (ADM › Quem pode entrar): fica só na memória deste objeto, sem gastar gravações do KV
[[durable_objects.bindings]]
name = "PRESENCA"
class_name = "Presenca"

[[migrations]]
tag = "presenca-v1"
new_sqlite_classes = ["Presenca"]

# mensagens (conversa geral + privadas): banco SQLite deste objeto; o que tem mais de 7 dias é apagado sozinho
[[durable_objects.bindings]]
name = "CONVERSAS"
class_name = "Conversas"

[[migrations]]
tag = "conversas-v1"
new_sqlite_classes = ["Conversas"]

# mídia da equipe para o Estúdio Problems Local (/midia/… no porteiro). O bucket é criado à mão na Cloudflare (R2 → Create bucket
# "estudio-midia"); enquanto ele não existir, a Action tira esta ligação antes de publicar e /midia responde 503.
[[r2_buckets]]
binding = "MIDIA"
bucket_name = "estudio-midia"
