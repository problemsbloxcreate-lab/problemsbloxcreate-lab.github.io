name: Busca temporaria (animacoes antigas)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { T: "${{ secrets.CLOUDFLARE_API_TOKEN }}", A: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node .github/scripts/busca-antiga.mjs
