name: Publicar o porteiro (Cloudflare)

# Publica o menu + o porteiro (pasta porteiro/) no Worker "estudio" da Cloudflare: um endereço só, com o login do
# Google conferido no servidor, para o menu e todos os projetos.
# Precisa dos segredos do repositório CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (conta "problemsraiz").
# O segredo SESSAO_SEGREDO do Worker é criado sozinho na primeira vez (e nunca aparece aqui).

on:
  push:
    branches: [main]
    paths: ["porteiro/**", "index.html", "404.html", "estudio-login.js", "estudio-conta.js", "estudio-carregando.js", "estudio-icones.js", "estudio-edicao.js", "favicon.svg", "favicon.ico", "icone-180.png", ".github/workflows/porteiro.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: porteiro
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WR: npx --yes wrangler@4.20.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Conferir os arquivos
        run: |
          node -e "import('./porteiro/worker.js').then(()=>console.log('porteiro ok'))"
          node -e "new Function(require('fs').readFileSync('estudio-login.js','utf8'))"
          node -e "new Function(require('fs').readFileSync('estudio-conta.js','utf8'))"
          node -e "new Function(require('fs').readFileSync('estudio-carregando.js','utf8'))"
          node -e "new Function(require('fs').readFileSync('estudio-icones.js','utf8'))"
          node -e "const E=require('./estudio-edicao.js');if(!E.legendas.gera({texto:'teste de legenda',d:1}).blocos.length)process.exit(1);console.log('edicao ok')"
          cmp index.html 404.html || { echo "::error::index.html e 404.html precisam ser iguais (o 404.html é cópia do menu)."; exit 1; }
          mkdir -p dist && cp index.html 404.html estudio-login.js estudio-conta.js estudio-carregando.js estudio-icones.js estudio-edicao.js favicon.svg favicon.ico icone-180.png dist/
          ls -la dist
      - name: Conferir os segredos
        id: seg
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Faltam os segredos CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID em Settings → Secrets and variables → Actions. Nada foi publicado."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - name: Criar ou achar o KV das contas (PERFIS)
        if: steps.seg.outputs.ok == '1'
        working-directory: porteiro
        shell: bash
        run: |
          set -euo pipefail
          achar() { $WR kv namespace list 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{let a=[];const m=s.match(/\[\s*[{\]]/);if(m){try{a=JSON.parse(s.slice(m.index,s.lastIndexOf(']')+1));}catch(e){}}const n=a.find(x=>/^estudio-PERFIS$|^PERFIS$/.test(x.title||''));process.stdout.write(n?n.id:'')})"; }
          ID="$(achar || true)"
          if [ -z "$ID" ]; then $WR kv namespace create PERFIS -c wrangler.toml 2>&1 | tee kv.log || true; ID="$(achar || true)"; fi
          [ -n "$ID" ] || ID="$(grep -oE '[0-9a-f]{32}' kv.log 2>/dev/null | head -1 || true)"
          [ -n "$ID" ] || { echo "::error::Não consegui criar nem achar o KV PERFIS (o token precisa de Workers KV Storage: Edit)."; exit 1; }
          sed -i "s/PREENCHIDO_PELA_ACTION/$ID/" wrangler.toml
          echo "KV PERFIS: $ID"
      - name: Conferir o bucket de mídia (R2 estudio-midia)
        if: steps.seg.outputs.ok == '1'
        working-directory: porteiro
        shell: bash
        run: |
          set -uo pipefail
          # a Action NÃO cria o bucket (R2 pede ativação na conta): sem ele, publica sem a ligação MIDIA e /midia responde 503
          if $WR r2 bucket list 2>/dev/null | grep -qw 'estudio-midia'; then echo "R2 estudio-midia: ok"
          else node -e "const f='wrangler.toml',fs=require('fs'),s=fs.readFileSync(f,'utf8'),i=s.indexOf('[[r2_buckets]]');if(i>=0)fs.writeFileSync(f,s.slice(0,i))"
            echo "::warning::O bucket R2 estudio-midia não existe (ou o token não tem R2: Edit). Publicando sem /midia."; fi
      - name: Publicar
        if: steps.seg.outputs.ok == '1'
        working-directory: porteiro
        shell: bash
        run: |
          set -uo pipefail
          $WR deploy -c wrangler.toml > ../deploy.log 2>&1 || { cat ../deploy.log; echo "::error::A publicação do porteiro falhou (veja o log acima)."; exit 1; }
          cat ../deploy.log
      - name: Criar o segredo da sessão (só na primeira vez)
        if: steps.seg.outputs.ok == '1'
        working-directory: porteiro
        shell: bash
        run: |
          set -uo pipefail
          if $WR secret list -c wrangler.toml 2>/dev/null | grep -q '"SESSAO_SEGREDO"'; then echo "SESSAO_SEGREDO já existe."
          else openssl rand -hex 32 | $WR secret put SESSAO_SEGREDO -c wrangler.toml > ../segredo.log 2>&1 || { cat ../segredo.log; echo "::error::Não consegui criar o SESSAO_SEGREDO."; exit 1; }; echo "SESSAO_SEGREDO criado."; fi
          # par de chaves do passe assinado (Shorts, Editor): a privada fica só no Worker; a pública sai em /chave-publica
          if $WR secret list -c wrangler.toml 2>/dev/null | grep -q '"ASSINATURA"'; then echo "ASSINATURA já existe."
          else node -e "(async()=>{const k=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);process.stdout.write(JSON.stringify({priv:await crypto.subtle.exportKey('jwk',k.privateKey),pub:await crypto.subtle.exportKey('jwk',k.publicKey)}))})()" | $WR secret put ASSINATURA -c wrangler.toml > ../assinatura.log 2>&1 || { cat ../assinatura.log; echo "::error::Não consegui criar a ASSINATURA."; exit 1; }; echo "ASSINATURA criada."; fi
      - name: Conferir que os projetos estão FECHADOS sem login
        if: steps.seg.outputs.ok == '1'
        shell: bash
        run: |
          set -euo pipefail
          URL="$(grep -oE 'https://estudio\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)"
          [ -n "$URL" ] || { echo "::error::Não achei o endereço workers.dev no resultado."; exit 1; }
          sleep 8
          COD="$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' "$URL/animador/")"
          LOC="$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Accept: text/html' "$URL/animador/")"
          echo "/animador/ sem login: $COD → $LOC"
          [ "$COD" = "302" ] && echo "$LOC" | grep -q '/?volta=' || { echo "::error::/animador/ respondeu $COD sem login (esperado 302 para o menu). Confira o porteiro!"; exit 1; }
          MCOD="$(curl -s -o menu.html -w '%{http_code}' "$URL/")"   # salva antes de procurar (procurar direto no curl falhava à toa)
          echo "menu: $MCOD, $(wc -c < menu.html) bytes"
          grep -q 'Entrar com Google' menu.html || { head -c 600 menu.html; echo; echo "::error::O menu não apareceu em $URL/ (resposta $MCOD)"; exit 1; }
          # mais leve: os scripts do menu saem com carimbo de versão e a página responde "não mudou" (304) quando é a mesma (só avisa, não trava)
          if grep -q 'estudio-carregando.js?_ev=' menu.html; then echo "::notice::Carimbo de versão nos scripts do menu: ok"; else echo "::warning::O menu saiu sem o carimbo de versão nos scripts (?_ev=)."; fi
          echo "::notice::Cabeçalhos do menu (gzip): $(curl -s -D - -o /dev/null -H 'Accept-Encoding: gzip, br' "$URL/" | tr -d '\r' | grep -iE '^(etag|content-encoding|cache-control):' | tr '\n' ' ' || true)"
          ET="$(curl -s -D - -o /dev/null "$URL/" | tr -d '\r' | grep -i '^etag:' | cut -d' ' -f2- || true)"
          LM="$(curl -s -D - -o /dev/null "$URL/" | tr -d '\r' | grep -i '^last-modified:' | cut -d' ' -f2- || true)"
          if [ -n "$ET" ]; then echo "::notice::ETag do menu: $ET · com If-None-Match: $(curl -s -o /dev/null -w '%{http_code}' -H "If-None-Match: $ET" "$URL/" || true)"; fi
          if [ -n "$LM" ]; then echo "::notice::Last-Modified do menu: $LM · com If-Modified-Since: $(curl -s -o /dev/null -w '%{http_code}' -H "If-Modified-Since: $LM" "$URL/" || true)"; elif [ -z "$ET" ]; then echo "::warning::O menu saiu sem ETag e sem Last-Modified."; fi
          JS="$(grep -o 'estudio-conta.js?_ev=[0-9a-f]*' menu.html | head -1 || true)"
          if [ -n "$JS" ]; then echo "::notice::Cache do script com carimbo: $(curl -s -D - -o /dev/null "$URL/$JS" | tr -d '\r' | grep -i '^cache-control:' || true)"; fi
          IC="$(curl -s -o /dev/null -w '%{http_code}' "$URL/estudio-icones.js")"; [ "$IC" = "200" ] && echo "::notice::/estudio-icones.js: 200 (ícones dos programas)" || echo "::warning::/estudio-icones.js respondeu $IC (os ícones novos não vão aparecer)"
          curl -s -o chave.json "$URL/chave-publica"; grep -q '"kty":"EC"' chave.json || { echo "::error::/chave-publica não respondeu a chave do passe: $(head -c 200 chave.json)"; exit 1; }
          # o porteiro consegue conferir login no servidor da turma? (login falso → o servidor deve responder 403, não erro de ligação)
          ECOD="$(curl -s -o entrar.json -w '%{http_code}' -X POST -H "Origin: $URL" -H 'content-type: application/json' -d '{"token":"teste-falso"}' "$URL/entrar")"
          echo "/entrar com login falso: $ECOD $(head -c 200 entrar.json)"
          [ "$ECOD" = "403" ] || { echo "::error::O porteiro não conseguiu conferir o login no servidor da turma (resposta $ECOD: $(head -c 160 entrar.json))."; exit 1; }
          if grep -q 'liberado no servidor' entrar.json; then echo "::error::O servidor da turma recusou o porteiro: coloque $URL na variável ORIGENS do turma-ia e faça Deploy."; exit 1; fi
          {
            echo "### 🚪 Porteiro no ar: $URL"
            echo ""
            echo "Para o login funcionar nesse endereço, adicione o domínio \`${URL#https://}\`:"
            echo "- no Firebase: Authentication → Settings → Authorized domains"
            echo "- na Cloudflare: variável ORIGENS do worker turma-ia (se ela não for \`*\`): \`$URL\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Conferir se o servidor da turma aceita este endereço (ORIGENS)
        if: steps.seg.outputs.ok == '1'
        shell: bash
        run: |
          set -uo pipefail
          URL="$(grep -oE 'https://estudio\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)"
          SRV="$(grep -oE '^SERVIDOR = "[^"]+"' porteiro/wrangler.toml | cut -d'"' -f2)"
          ACAO="$(curl -s -o /dev/null -D - -X OPTIONS -H "Origin: $URL" -H 'Access-Control-Request-Method: GET' -H 'Access-Control-Request-Headers: authorization' "$SRV/quem" | tr -d '\r' | grep -i '^access-control-allow-origin:' | cut -d' ' -f2-)"
          STATUS="$(curl -s "$SRV/" | head -c 400)"
          echo "::notice::Servidor $SRV respondeu para $URL: access-control-allow-origin = '${ACAO:-nada}'"
          echo "::notice::Situação do servidor: $STATUS"
          if [ "$ACAO" != "$URL" ] && [ "$ACAO" != "*" ]; then
            echo "::warning::O servidor da turma ainda NÃO aceita $URL. Na Cloudflare: worker turma-ia → Settings → Variables and Secrets → ORIGENS deve conter $URL → salvar e Deploy."
          fi
      - name: Diagnóstico dos projetos (o porteiro chega neles? os portões aceitam o passe?)
        if: steps.seg.outputs.ok == '1'
        shell: bash
        run: |
          set -uo pipefail
          URL="$(grep -oE 'https://estudio\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)"
          curl -s "$URL/diagnostico" > diag.json; cat diag.json; echo
          node -e "
            const d=JSON.parse(require('fs').readFileSync('diag.json','utf8'));
            for (const [p,v] of Object.entries(d)) {
              const ok = !!v.para || !v.erro && v.status < 500 && v.passe !== false && !String(v.ligacao||'').startsWith('FALTA');
              console.log((ok?'::notice::':'::warning::')+p+' → '+JSON.stringify(v));
            }"
