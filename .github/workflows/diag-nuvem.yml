name: Diagnóstico da nuvem (Cloudflare)

# Só roda à mão (Actions › Diagnóstico da nuvem › Run workflow). Não muda nada na nuvem: confere se o KV da equipe
# responde (listar), quantas operações o KV e o turma-ia fizeram hoje (limites do plano grátis por dia) e os erros do dia.
# Nenhum e-mail, chave ou conteúdo de arquivo aparece no resultado.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Conferir
        shell: bash
        run: |
          set -uo pipefail
          API="https://api.cloudflare.com/client/v4"; H=(-H "Authorization: Bearer $CF_TOKEN")
          curl -sS "${H[@]}" "$API/accounts/$CF_ACC/workers/scripts/turma-ia/settings" > s.json
          NS=$(node -e "const j=require('./s.json');const b=(j.result||{}).bindings||[];const k=b.find(x=>x.name==='EQUIPE');process.stdout.write(k?k.namespace_id:'')")
          [ -n "$NS" ] || { echo "::error::Não achei o KV EQUIPE no turma-ia."; exit 1; }
          L=$(curl -sS "${H[@]}" "$API/accounts/$CF_ACC/storage/kv/namespaces/$NS/keys?limit=10&prefix=personagens/")
          echo "::notice::Listar o KV da equipe: $(echo "$L" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log(j.success?('ok ('+(j.result||[]).length+' chaves na 1ª página)'):('ERRO '+JSON.stringify(j.errors).slice(0,300)))}catch{console.log(s.slice(0,300))}})")"
          HOJE=$(date -u +%Y-%m-%d)
          Q='{"query":"query($a:String!,$d:Date!,$t:Time!){viewer{accounts(filter:{accountTag:$a}){kv:kvOperationsAdaptiveGroups(limit:50,filter:{date_geq:$d}){sum{requests}dimensions{actionType namespaceId result}} w:workersInvocationsAdaptive(limit:50,filter:{datetime_geq:$t}){sum{requests errors}dimensions{scriptName status}}}}}","variables":{"a":"'$CF_ACC'","d":"'$HOJE'","t":"'$HOJE'T00:00:00Z"}}'
          curl -sS "${H[@]}" -H 'content-type: application/json' -d "$Q" "$API/graphql" > g.json
          NS="$NS" node - <<'JS'
          const j = require('./g.json'), ns = process.env.NS;
          if (j.errors && !j.data) { console.log('::warning::Sem acesso às estatísticas do dia (o token precisa de Account Analytics: Read): ' + JSON.stringify(j.errors).slice(0, 300)); process.exit(0); }
          const a = j.data?.viewer?.accounts?.[0] || {};
          const kv = {}; for (const g of a.kv || []) { const d = g.dimensions; const k = (d.namespaceId === ns ? 'EQUIPE' : 'outro KV') + ' ' + d.actionType + (d.result && d.result !== 'success' ? ' (' + d.result + ')' : ''); kv[k] = (kv[k] || 0) + g.sum.requests; }
          console.log('::notice::KV hoje (UTC): ' + (Object.entries(kv).map(([k, v]) => k + ' = ' + v).join(' · ') || 'nada'));
          const w = {}; for (const g of a.w || []) { const d = g.dimensions; const k = d.scriptName + ' ' + d.status; w[k] = (w[k] || 0) + g.sum.requests; }
          console.log('::notice::Workers hoje (UTC): ' + (Object.entries(w).map(([k, v]) => k + ' = ' + v).join(' · ') || 'nada'));
          JS
