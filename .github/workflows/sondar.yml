name: Sondar endereços (diagnóstico)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          for u in https://estudio-problems.problemsbloxcreate.workers.dev https://estudio-problems.problemsraiz.workers.dev https://editor-problems.problemsbloxcreate.workers.dev https://editor-problems.problemsraiz.workers.dev https://sons-problems.problemsbloxcreate.workers.dev https://sons-problems.problemsraiz.workers.dev; do
            C1="$(curl -s -o /tmp/t -w '%{http_code}' "$u/porteiro-teste")"; B="$(head -c 80 /tmp/t | tr -d '\n')"
            C2="$(curl -s -o /dev/null -w '%{http_code}' "$u/robots.txt")"
            echo "::notice::$u → /porteiro-teste $C1 [$B] · /robots.txt $C2"
          done
