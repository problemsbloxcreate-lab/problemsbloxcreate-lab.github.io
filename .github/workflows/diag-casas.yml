name: Diagnostico das casas (so contagens)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  ver:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          node -e "
          const h={authorization:'Bearer '+process.env.T,'content-type':'application/json'},B='https://api.cloudflare.com/client/v4/accounts/'+process.env.A;
          (async()=>{const l=await (await fetch(B+'/d1/database?name=equipe',{headers:h})).json();const id=l.result[0].uuid;
          const q=async sql=>{const j=await (await fetch(B+'/d1/database/'+id+'/query',{method:'POST',headers:h,body:JSON.stringify({sql})})).json();if(!j.success)throw new Error(JSON.stringify(j.errors));return j.result[0].results};
          console.log(JSON.stringify(await q('SELECT coalesce(onde,\'principal\') AS casa,count(*) AS n,round(sum(tam)/1048576.0,1) AS mb FROM arq GROUP BY onde')));
          console.log(JSON.stringify(await q('SELECT v FROM cfg WHERE k IN (\'ativo\',\'arquivos\',\'casas\')')));
          })().catch(e=>{console.log('erro',e.message);process.exit(1)})"
